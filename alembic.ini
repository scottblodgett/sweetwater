[alembic]
script_location = alembic
prepend_sys_path = .
# `path_separator`, not the older `version_path_separator`: alembic 1.14 deprecates the
# latter and warns, and a DeprecationWarning in this repo's pytest config is an error.
path_separator = os

# No sqlalchemy.url here, deliberately. The URL comes from .env through
# src/utils/config.py, so there is exactly one place a connection string lives and
# `alembic upgrade head` can never be pointed somewhere the app is not.
#
# Which database is chosen by SW_OPS_TARGET (default `prod`) or `-x target=test`:
#
#   .venv/Scripts/python.exe -m alembic upgrade head                  -> DATABASE_URL,      schema sw_ops
#   SW_OPS_TARGET=test .venv/Scripts/python.exe -m alembic upgrade head -> DATABASE_URL_TEST, schema sw_ops_test
#
# No [loggers] section, also deliberately. This repo configures logging in exactly one
# place (src/utils/logger.py, three streams). Letting alembic's ini run fileConfig would
# reset the root logger and silently unwire them for the rest of the process.
